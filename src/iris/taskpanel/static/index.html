<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iris 任务面板</title>
<style>
  :root {
    --bg: #0f1115; --card: #171a21; --border: #262a33;
    --fg: #e6e9ef; --fg-dim: #9aa3b2;
    --green: #3fb950; --red: #f85149; --yellow: #d29922; --cyan: #39c5cf;
    --blue: #58a6ff; --purple: #bc8cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 20px 24px 32px; max-width: 1280px; margin: 0 auto;
  }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  h1 { font-size: 20px; font-weight: 600; }
  .subtitle { color: var(--fg-dim); font-size: 12px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
  .dot.on  { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.off { background: var(--fg-dim); }
  #offline-banner {
    display: none; background: #3a1d1d; border: 1px solid var(--red); color: #ffb3ad;
    padding: 8px 14px; border-radius: 8px; margin: 12px 0; font-size: 13px;
  }
  #offline-banner code { background: #4a2424; padding: 1px 6px; border-radius: 4px; }
  nav { margin: 14px 0 10px; }
  nav label { color: var(--fg-dim); font-size: 13px; margin-right: 8px; }
  select {
    background: var(--card); color: var(--fg); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 8px; font-size: 13px;
  }
  #summary {
    display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0 18px;
  }
  .stat {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 18px; min-width: 130px;
  }
  .stat .num { font-size: 22px; font-weight: 600; }
  .stat .label { color: var(--fg-dim); font-size: 12px; margin-top: 2px; }
  .stat.green .num { color: var(--green); }
  .stat.red .num { color: var(--red); }
  .stat.yellow .num { color: var(--yellow); }
  .stat.cyan .num { color: var(--cyan); }
  h2 { font-size: 14px; color: var(--fg-dim); font-weight: 600; margin: 20px 0 10px; }
  #running-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px;
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; position: relative;
  }
  .card.running { border-color: #2d3540; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { border-color: #2d3540; }
    50% { border-color: #3a4656; }
  }
  .card.flash-interrupted { border-color: var(--yellow); box-shadow: 0 0 10px rgba(210,153,34,.35); }
  .card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .task-name { font-size: 15px; font-weight: 600; }
  .pill { font-size: 11px; padding: 2px 9px; border-radius: 999px; border: 1px solid; }
  .pill.running { color: var(--cyan); border-color: var(--cyan); }
  .phase-row { margin-top: 8px; font-size: 13px; color: var(--fg); display: flex; gap: 6px; align-items: center; }
  .phase-badge {
    font-size: 11px; color: var(--blue); background: #17222f; border-radius: 4px; padding: 1px 6px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; flex-shrink: 0;
  }
  .phase-detail { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .progress-outer { margin-top: 9px; height: 6px; background: var(--border); border-radius: 8px; overflow: hidden; }
  .progress-inner { height: 100%; background: var(--blue); border-radius: 8px; transition: width .6s ease; }
  .card-meta {
    margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap;
    font-size: 11px; color: var(--fg-dim);
  }
  .badge { background: #20242c; border-radius: 4px; padding: 1px 7px; }
  .badge.agent { color: var(--purple); }
  .cmd {
    margin-top: 8px; font-size: 11px; color: var(--fg-dim);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #history-list { border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
  .hrow {
    display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--card);
    border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .hrow:last-child { border-bottom: none; }
  .hbar { width: 4px; height: 28px; border-radius: 2px; flex-shrink: 0; }
  .hbar.success { background: var(--green); }
  .hbar.failed { background: var(--red); }
  .hbar.interrupted { background: var(--yellow); }
  .hname { font-weight: 600; min-width: 170px; }
  .hstatus { font-size: 12px; }
  .hstatus.success { color: var(--green); }
  .hstatus.failed { color: var(--red); }
  .hstatus.interrupted { color: var(--yellow); }
  .htime { color: var(--fg-dim); font-size: 12px; margin-left: auto; flex-shrink: 0; }
  .herr { color: var(--red); font-size: 12px; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { color: var(--fg-dim); font-size: 13px; padding: 6px 2px; }
  footer { margin-top: 26px; color: var(--fg-dim); font-size: 11px; border-top: 1px solid var(--border); padding-top: 10px; }
  #watchdog-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .wd {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
    background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px;
  }
  .wd .dot { width: 7px; height: 7px; margin: 0; }
  .interrupt-toast {
    display: none; position: fixed; top: 18px; right: 22px; z-index: 10;
    background: #3a2f14; border: 1px solid var(--yellow); color: #f0d48a;
    padding: 10px 16px; border-radius: 8px; font-size: 13px;
  }
</style>
</head>
<body>
<header>
  <h1>📊 Iris 任务面板</h1>
  <span><span class="dot on" id="status-dot"></span><span class="subtitle" id="status-text">连接中…</span></span>
  <span class="subtitle" id="daemon-info"></span>
  <span class="subtitle">数据只读 · 操作请用 <code>iris</code> CLI</span>
</header>

<div id="offline-banner">
  守护进程未运行——请执行 <code>iris task-panel start</code> 后自动恢复。
</div>

<nav>
  <label for="agent-filter">Agent 过滤</label>
  <select id="agent-filter">
    <option value="__all__">全部</option>
  </select>
</nav>

<div id="summary"></div>

<h2>▶ 运行中</h2>
<div id="watchdog-row"></div>
<div id="running-grid"></div>

<h2>✔ 历史（最近 200 条）</h2>
<div id="history-list"></div>

<div class="interrupt-toast" id="interrupt-toast"></div>

<footer>每 2s 自动刷新 · 本地只读展示 · 进程被终止的任务由探测兜底标记为「中断」</footer>

<script>
"use strict";
const POLL_MS = 2000;
let timer = null;
let lastState = null;
const AGENT_KEY = "iris-taskpanel-agent";
const STATUS_TEXT = { success: "成功", failed: "失败", interrupted: "中断" };
const STATUS_CLS = { running: "running", success: "success", failed: "failed", interrupted: "interrupted" };

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;  // textContent 防 XSS
  return node;
}

function fmtDuration(startIso, endIso) {
  if (!startIso) return "";
  const start = Date.parse(startIso);
  const end = endIso ? Date.parse(endIso) : Date.now();
  if (isNaN(start) || isNaN(end)) return "";
  let sec = Math.max(0, Math.floor((end - start) / 1000));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  if (h > 0) return `${h}小时${m}分`;
  if (m > 0) return `${m}分${s}秒`;
  return `${s}秒`;
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return iso.slice(0, 19);
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function buildSummary(state) {
  const box = document.getElementById("summary");
  box.textContent = "";
  const running = state.running;
  const hist = state.history;
  const byType = {};
  running.forEach((t) => { byType[t.name] = (byType[t.name] || 0) + 1; });
  const typeDesc = Object.entries(byType).map(([k, v]) => `${k} ${v}`).join(" · ") || "无";
  let ok = 0, fail = 0, inter = 0;
  hist.forEach((h) => {
    if (h.status === "success") ok++;
    else if (h.status === "failed") fail++;
    else if (h.status === "interrupted") inter++;
  });
  const rate = hist.length ? Math.round((ok / hist.length) * 100) : 0;

  const s1 = el("div", "stat cyan"); s1.appendChild(el("div", "num", String(running.length))); s1.appendChild(el("div", "label", `运行中 · ${typeDesc}`));
  const s2 = el("div", "stat green"); s2.appendChild(el("div", "num", String(ok))); s2.appendChild(el("div", "label", "历史成功"));
  const s3 = el("div", "stat red"); s3.appendChild(el("div", "num", String(fail))); s3.appendChild(el("div", "label", "历史失败"));
  const s4 = el("div", "stat yellow"); s4.appendChild(el("div", "num", String(inter))); s4.appendChild(el("div", "label", "历史中断"));
  const s5 = el("div", "stat"); s5.appendChild(el("div", "num", `${rate}%`)); s5.appendChild(el("div", "label", `成功率（近 ${hist.length} 条）`));
  box.append(s1, s2, s3, s4, s5);
}

function buildWatchdog(state) {
  const row = document.getElementById("watchdog-row");
  row.textContent = "";
  (state.watchdog || []).forEach((w) => {
    const item = el("span", "wd");
    const dot = el("span", "dot " + (w.status === "running" ? "on" : "off"));
    const label = el("span", "", `${w.name} · ${w.status === "running" ? `运行中 (pid ${w.pid})` : "未运行"}`);
    item.append(dot, label);
    row.appendChild(item);
  });
}

function buildRunning(state) {
  const grid = document.getElementById("running-grid");
  grid.textContent = "";
  const agent = localStorage.getItem(AGENT_KEY) || "__all__";
  const running = state.running.filter((t) => agent === "__all__" || t.agent_id === agent);
  if (!running.length) {
    grid.appendChild(el("div", "empty", "当前没有运行中的任务。在 CLI 中执行长任务（如 iris daily-start）即可在此看到状态。"));
    return;
  }
  const interruptedNow = new Set(state.interrupted_now || []);
  running.forEach((t) => {
    const card = el("div", "card running");
    if (interruptedNow.has(t.task_id)) card.classList.add("flash-interrupted");
    const top = el("div", "card-top");
    top.appendChild(el("span", "task-name", t.name));
    top.appendChild(el("span", "pill running", "运行中"));
    card.appendChild(top);
    const phaseRow = el("div", "phase-row");
    phaseRow.appendChild(el("span", "phase-badge", t.phase || "init"));
    phaseRow.appendChild(el("span", "phase-detail", t.phase_detail || "启动中…"));
    card.appendChild(phaseRow);
    if (t.progress !== null && t.progress !== undefined) {
      const outer = el("div", "progress-outer");
      const inner = el("div", "progress-inner");
      inner.style.width = `${Math.min(100, Math.max(0, t.progress * 100)).toFixed(1)}%`;
      outer.appendChild(inner);
      card.appendChild(outer);
    }
    const meta = el("div", "card-meta");
    meta.appendChild(el("span", "badge", `⏱ ${fmtDuration(t.started_at)}`));
    if (t.pid) meta.appendChild(el("span", "badge", `pid ${t.pid}`));
    if (t.agent_id && t.agent_id !== "default") meta.appendChild(el("span", "badge agent", `agent ${t.agent_id}`));
    meta.appendChild(el("span", "badge", `启动 ${fmtTime(t.started_at)}`));
    card.appendChild(meta);
    if (t.command) {
      const cmd = el("div", "cmd", t.command);
      cmd.title = t.command;
      card.appendChild(cmd);
    }
    grid.appendChild(card);
  });
}

function buildHistory(state) {
  const list = document.getElementById("history-list");
  list.textContent = "";
  const agent = localStorage.getItem(AGENT_KEY) || "__all__";
  const hist = state.history.filter((h) => agent === "__all__" || h.agent_id === agent).slice().reverse();
  if (!hist.length) {
    list.appendChild(el("div", "empty", "暂无历史记录。任务正常/异常退出后在此归档。"));
    return;
  }
  hist.forEach((h) => {
    const row = el("div", "hrow");
    row.appendChild(el("div", "hbar " + (STATUS_CLS[h.status] || "")));
    row.appendChild(el("span", "hname", h.name));
    row.appendChild(el("span", "hstatus " + (STATUS_CLS[h.status] || ""), STATUS_TEXT[h.status] || h.status));
    if (h.error) {
      const err = el("span", "herr", h.error);
      err.title = h.error;
      row.appendChild(err);
    }
    row.appendChild(el("span", "htime", `${fmtTime(h.started_at)} → ${fmtTime(h.ended_at)} · 耗时 ${fmtDuration(h.started_at, h.ended_at)}`));
    list.appendChild(row);
  });
}

function buildAgentFilter(state) {
  const select = document.getElementById("agent-filter");
  const saved = localStorage.getItem(AGENT_KEY) || "__all__";
  const agents = state.agents || ["default"];
  const current = new Set([...select.options].map((o) => o.value));
  const wanted = new Set(["__all__", ...agents]);
  // 追加新 agent 选项
  agents.forEach((a) => {
    if (!current.has(a)) {
      const opt = el("option", "", a);
      opt.value = a;
      select.appendChild(opt);
    }
  });
  // 移除已消失的 agent 选项（保留 __all__ 与已选）
  [...select.options].forEach((o) => {
    if (!wanted.has(o.value) && o.value !== saved) select.removeChild(o);
  });
  if (saved !== select.value) select.value = saved;
}

function showToast(text) {
  const toast = document.getElementById("interrupt-toast");
  toast.textContent = text;
  toast.style.display = "block";
  setTimeout(() => { toast.style.display = "none"; }, 5000);
}

function render(state) {
  lastState = state;
  const dot = document.getElementById("status-dot");
  const statusText = document.getElementById("status-text");
  dot.className = "dot on";
  statusText.textContent = "已连接";
  document.getElementById("offline-banner").style.display = "none";
  const d = state.daemon || {};
  const up = d.uptime_sec || 0;
  const upH = Math.floor(up / 3600), upM = Math.floor((up % 3600) / 60), upS = up % 60;
  const upText = upH > 0 ? `${upH}h${upM}m` : (upM > 0 ? `${upM}m${upS}s` : `${upS}s`);
  document.getElementById("daemon-info").textContent =
    `守护进程 pid ${d.pid || "-"} · 端口 ${d.port || "-"} · 已运行 ${upText} · v${state.version || "-"}`;
  buildAgentFilter(state);
  buildSummary(state);
  buildWatchdog(state);
  buildRunning(state);
  buildHistory(state);
  if ((state.interrupted_now || []).length) {
    showToast(`⚠ 检测到 ${state.interrupted_now.length} 个任务被中断（进程终止），已归档历史`);
  }
}

function poll() {
  fetch("/api/state", { cache: "no-store" })
    .then((resp) => {
      if (!resp.ok) throw new Error("http " + resp.status);
      return resp.json();
    })
    .then(render)
    .catch(() => {
      const dot = document.getElementById("status-dot");
      dot.className = "dot off";
      document.getElementById("status-text").textContent = "服务未运行";
      document.getElementById("offline-banner").style.display = "block";
      // 保留已渲染数据（降级为灰色状态点）
    });
}

document.getElementById("agent-filter").addEventListener("change", (e) => {
  localStorage.setItem(AGENT_KEY, e.target.value);
  if (lastState) { buildRunning(lastState); buildHistory(lastState); }
});

function startPolling() { if (!timer) { poll(); timer = setInterval(poll, POLL_MS); } }
function stopPolling() { if (timer) { clearInterval(timer); timer = null; } }

// 标签页隐藏时暂停轮询（省电），恢复时立即刷新
document.addEventListener("visibilitychange", () => {
  if (document.hidden) stopPolling(); else startPolling();
});

// 初始化恢复 agent 选择
const savedAgent = localStorage.getItem(AGENT_KEY);
if (savedAgent) document.getElementById("agent-filter").value = savedAgent;
startPolling();
</script>
</body>
</html>
