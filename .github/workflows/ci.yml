name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            constraints.txt
            pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libmupdf-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt

      - name: Lint with ruff
        run: ruff check src scripts tests

      - name: Security static scan
        run: python scripts/security_scan.py

      - name: Build package
        run: pip wheel . --no-deps --no-build-isolation -w dist

      - name: Generate SPDX SBOM
        run: python scripts/generate_sbom.py --output dist/iris.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: iris-sbom-${{ matrix.python-version }}
          path: dist/iris.spdx.json

      - name: Type check (reported)
        run: mypy src/iris --no-incremental

      - name: Dependency security audit
        run: pip-audit

      - name: Unit tests
        # 覆盖率由下一步和集成测试合并后统一判定；此处不能提前触发
        # 全局 fail_under，否则低 I/O 的 unit 子集会在集成测试前失败。
        run: pytest tests/ -m unit --cov=src/iris --cov-append --cov-report= --cov-fail-under=0 -x --tb=short -q

      - name: Integration tests + coverage
        run: pytest tests/ -m integration --cov=src/iris --cov-append --cov-report=term --cov-report=xml --cov-report=json:coverage.json -x --tb=short

      - name: Critical module coverage gates
        run: python scripts/check_coverage_thresholds.py coverage.json

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  macos-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
      - name: Install CLI dependencies
        run: pip install -e . -c constraints.txt
      - name: CLI smoke test
        run: iris --help
