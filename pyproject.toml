[project]
name = "iris"
version = "3.17.1"
description = "工作知识助手 — 个人知识库与飞书团队知识库集成"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "maintainer"},
]
dependencies = [
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "numpy>=1.26",
    "pydantic>=2.0",
]

[project.optional-dependencies]
transcribe = ["openai-whisper>=20231117"]
weekly = ["beautifulsoup4>=4.12"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
graph = ["networkx>=3.0"]
async = ["httpx>=0.27"]

[project.scripts]
iris = "scripts.run_cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/iris"]
omit = ["*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true
fail_under = 53

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.ruff.lint.per-file-ignores]
# BLE001: Do not catch blind exception — 项目架构大量依赖外部服务
# (LLM API / 飞书 API / 文件 I/O)，宽泛捕获是有意的容错策略。
"src/iris/**/*.py" = ["BLE001"]
