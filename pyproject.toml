[project]
name = "iris"
version = "3.0.0"
description = "工作知识助手 — 个人知识库与飞书团队知识库集成"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "maintainer"},
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["src"]
