[project]
name = "iris"
version = "3.36.0"
description = "工作知识助手 — 个人知识库与飞书团队知识库集成"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "maintainer"},
]
dependencies = [
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "numpy>=1.26",
    "pydantic>=2.0",
]

[project.optional-dependencies]
transcribe = ["openai-whisper>=20231117"]
weekly = ["beautifulsoup4>=4.12"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.15,<0.16",
    "mypy>=1.10,<2",
    "pip-audit>=2.9,<3",
    "pre-commit>=4,<5",
]
graph = ["networkx>=3.0"]
async = ["httpx>=0.27"]
asr = [
    "funasr>=1.4",
    "onnxruntime>=1.19",
    "sounddevice>=0.5",
    "torchaudio>=2.0",
    "pyahocorasick>=2.0",
]

[project.scripts]
# 入口指向 src 内模块（editable .pth 只加 src/）：任意 cwd 均可运行，
# scripts.run_cli:main 的旧入口依赖 scripts/ 在 sys.path，重装后失效（v3.27.0 修复）
iris = "iris.app._cli_main:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "unit: 纯逻辑测试，无 I/O，无 mock，快速反馈",
    "integration: 需要文件系统、mock 外部服务或真实 I/O",
]
filterwarnings = [
    "ignore:builtin type swigvarlink has no __module__:DeprecationWarning",
    "ignore:builtin type SwigPyPacked has no __module__:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__:DeprecationWarning",
    "ignore:Exception ignored in.*_TemporaryFileCloser.*:pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["src/iris"]
omit = ["*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true
fail_under = 65

[tool.ruff.lint]
# 默认规则集（E/F）之外启用 C901 圈复杂度门禁（阈值见 [tool.ruff.lint.mccabe]）。
# BLE001: 宽泛捕获是有意的容错策略（见下方 per-file 说明）
# E402: 有意延迟导入以避免循环依赖
extend-select = ["C901"]
ignore = ["BLE001", "E402"]

[tool.ruff.lint.mccabe]
# 新增/修改函数圈复杂度 ≤ 20；存量 10–19 区间的函数（~90 个）不在本轮治理范围
max-complexity = 20

[tool.ruff.lint.per-file-ignores]
# BLE001: Do not catch blind exception — 项目架构大量依赖外部服务
# (LLM API / 飞书 API / 文件 I/O)，宽泛捕获是有意的容错策略。
"src/iris/**/*.py" = ["BLE001"]
# F401: 包 __init__.py 中的导入是对外 re-export，属公开 API。
"src/iris/**/__init__.py" = ["F401"]
# F401: handlers.py 是 _handlers/ 子模块的向后兼容 facade（re-export 全部 handler）。
"src/iris/app/cli/handlers.py" = ["F401"]
# E402: 有意延迟导入以避免循环依赖（wiki 内部模块 / feishu / llm provider）
"src/iris/app/cli/_handlers/_wiki.py" = ["E402"]
"src/iris/feishu/doc_convert.py" = ["E402"]
"src/iris/llm/provider.py" = ["E402"]
"src/iris/memory/long_term.py" = ["E402"]
"src/iris/retrieval/planner.py" = ["E402"]
"src/iris/retrieval/vector_index.py" = ["E402"]
"src/iris/wiki/_relation_extractor.py" = ["E402"]
"src/iris/wiki/navigation.py" = ["E402"]
# 测试中常用未读取的构造结果和 mock 绑定来验证副作用。
"tests/**/*.py" = ["E741", "F841"]

[tool.mypy]
# v3.34.0：严格类型检查纳入 CI；动态/平台专属模块通过显式兼容边界隔离。
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
# 可选依赖（networkx/httpx）有无 stubs 会改变 ignore 是否"多余"，不开 warn_unused_ignores 以免基线随环境漂移
warn_unused_ignores = false
show_error_codes = true
exclude = ["^tests/", "^scripts/"]

# 兼容旧版动态边界与平台专属实现：这些模块正在逐步引入 Protocol，
# 暂不让第三方 stub/历史联合模型阻断其余模块的严格类型检查。
[[tool.mypy.overrides]]
module = [
    "iris.evaluation.deep_eval",
    "iris.assistant._doc_writer",
    "iris.trello.client",
    "iris.feishu.doc_convert",
    "iris.wiki.navigation",
    "iris.wiki.asr.corrector",
    "iris.core",
    "iris.assistant._asr",
    "iris.wiki.generator",
    "iris.retrieval.enhanced",
    "iris.app.cli._handlers._feed",
    "iris.assistant.live",
    "iris.analysis.service",
    "iris.app.cli._handlers._content",
    "iris.app.cli.handlers",
    "iris.assistant._corrector",
    "iris.taskpanel.reporter",
    "iris.feed._topic_detector",
]
ignore_errors = true
