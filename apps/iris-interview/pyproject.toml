[project]
name = "iris-interview"
version = "0.1.2"
description = "知遇 · Iris-interview — 个人面试工作台"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7", "numpy>=1.26", "httpx>=0.27", "keyring>=25", "filelock>=4.2.1", "PyMuPDF>=1.24", "python-docx>=1.1", "anyio>=4.14.2", "certifi>=2026.10.18", "idna>=3.15", "lxml>=6.1.0", "requests>=2.33", "urllib3>=2.8"]

[project.optional-dependencies]
asr = ["funasr-onnx==0.4.2", "onnxruntime>=1.19", "scipy>=1.11", "sounddevice>=0.5", "msgpack>=1.2.3"]
dev = ["pytest>=9.0.3", "ruff>=0.15,<0.16", "pyinstaller>=6"]

[project.scripts]
iris-interview = "iris_interview.app:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iris_interview = ["assets/**/*", "config/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "../iris-caption/src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
extend-select = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 20
