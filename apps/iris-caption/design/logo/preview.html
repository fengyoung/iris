<h1>Iris Caption · 标志评审稿</h1>
<p>原版图形、渐变与黑底完整保留。新增提示均为独立 SVG 组，可继续编辑。当前尚未应用到产品。</p>
<img class="sheet" src="contact-sheet.png" alt="原版、A 双行字幕、B 轻声波、C 字幕框的浅色与深色背景对照，包含实际 32 和 64 像素预览">
<nav aria-label="下载可编辑 SVG"><a href="reference-original.svg">原版 SVG</a><a href="iris-caption-A.svg">A · 双行字幕 SVG</a><a href="iris-caption-B.svg">B · 轻声波 SVG</a><a href="iris-caption-C.svg">C · 字幕框 SVG</a><a href="contact-sheet.png">完整 PNG 对照图</a></nav>
<p><strong>建议选 A。</strong> 两条圆端横线呼应字幕排版，32 px 下仍有清楚的双行节奏；新增细节最少，更贴合 Iris Caption 的定位。B 偏音频输入，C 的字幕含义最明确，但小尺寸下更密集。</p>
